[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytx-trader"
version = "0.1.0"
description = "Crypto trading steps for AI assistants on bytx: scanner, funding/OI, entry, exit, time machine, risk-based size, risk gate, paper/demo broker. MCP server + CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["bytx>=0.2.1", "mcp>=1.2"]
keywords = ["crypto", "trading", "mcp", "claude", "paper-trading", "bytx"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bytx-trader = "bytx_trader.cli:main"
bytx-trader-mcp = "bytx_trader.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bytx_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
