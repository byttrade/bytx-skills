[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytx-trader"
version = "0.1.5"
description = "Crypto trading steps for AI assistants on bytx: scanner, funding/OI, entry, exit, time machine, risk-based size, risk gate, paper/demo broker. MCP server + CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["bytx>=0.2.2,<0.3", "mcp>=1.2"]  # <0.3: a breaking bytx needs a bytx-trader release first
keywords = [
    "crypto", "trading", "mcp", "claude", "paper-trading", "bytx",
    "mcp-server", "model-context-protocol", "ai-agents", "claude-skills", "binance", "bybit", "okx",
    "risk-management", "position-sizing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/byttrade/bytx-skills"
Repository = "https://github.com/byttrade/bytx-skills"
Documentation = "https://github.com/byttrade/bytx-skills#readme"
Changelog = "https://github.com/byttrade/bytx-skills/releases"
Issues = "https://github.com/byttrade/bytx-skills/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bytx-trader = "bytx_trader.cli:main"
bytx-trader-mcp = "bytx_trader.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bytx_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
